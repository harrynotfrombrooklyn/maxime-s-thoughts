<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxime's Thoughts</title>

  <style>

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .desktop {
      padding: 40px;
    }

    .window {
      border: 2px solid white;
      padding: 20px;
      background: #1a1a1a;
    }

    .title-bar {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .menu {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .menu button {
      padding: 10px 20px;
      cursor: pointer;
      background: black;
      color: white;
      border: 1px solid white;
    }

    .section.hidden {
      display: none;
    }

    .category {
      margin-bottom: 20px;
    }

    .category a {
      display: block;
      color: cyan;
      margin: 5px 0;
    }

    /* Viewing Options */
    .view-options {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20,20,20,0.9);
      border: 2px solid white;
      padding: 15px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .view-options h3 {
      margin: 0;
      color: white;
      font-size: 18px;
    }

    .view-options button {
      padding: 10px;
      background: black;
      color: white;
      border: 1px solid white;
      cursor: pointer;
    }

    .view-options button:hover {
      background: white;
      color: black;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .hidden {
      display: none;
    }

    .overlay-box {
      text-align: center;
      color: white;
    }

    .overlay-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .overlay-buttons button {
      padding: 15px 30px;
      font-size: 1.2rem;
      background: black;
      color: white;
      border: 2px solid white;
      cursor: pointer;
    }

    .cinema-mode {
      background: black;
      filter: brightness(0.7);
    }

    .crt {
      animation: flicker 0.08s infinite;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.97; }
      100% { opacity: 1; }
    }

  </style>
</head>

<body>

<!-- Viewing Options -->
<div class="view-options">
  <h3>Visionnage</h3>

  <button onclick="toggleFullscreen()">
    Plein écran
  </button>

  <button onclick="toggleCinemaMode()">
    Mode Cinéma
  </button>

  <button onclick="toggleCRT()">
    CRT Effect
  </button>
</div>

<div class="desktop">
  <div class="window main-window">

    <div class="title-bar">
      <span>Maxime's Thoughts</span>
    </div>

    <div class="content">

      <h1>Bienvenue dans Maxime's Thoughts</h1>

      <div class="menu">
        <button onclick="showSection('memories')">
          Memories
        </button>

        <button onclick="showSection('dream')">
          Dream
        </button>
      </div>

      <div id="memories" class="section hidden">
        <h2>Memories</h2>

        <div class="category">
          <h3>2024</h3>
          <a href="https://youtu.be/YLIDy7gZzBY" target="_blank">
            Memory 0 - Affaire De Famille
          </a>
        </div>
      </div>

      <div id="dream" class="section hidden">
        <h2>Dream</h2>

        <div class="category">
          <h3>2025</h3>

          <a href="https://youtu.be/7L7lhqFzqwM" target="_blank">
            Dream 001 - Rubberen Eend
          </a>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Existential Overlay -->
<div id="existential-overlay" class="overlay hidden">
  <div class="overlay-box">

    <h1>Do you exist?</h1>

    <div class="overlay-buttons">
      <button onclick="answerExistence(true)">
        Yes
      </button>

      <button onclick="answerExistence(false)">
        No
      </button>
    </div>

  </div>
</div>

<!-- Pill Overlay -->
<div id="pill-overlay" class="overlay hidden">
  <div class="overlay-box">

    <h1>Choose wisely</h1>

    <div class="overlay-buttons">
      <button onclick="bluePill()">
        Blue Pill
      </button>

      <button onclick="redPill()">
        Red Pill
      </button>
    </div>

  </div>
</div>

<script>

function showSection(sectionId) {

  document.querySelectorAll('.section').forEach(section => {
    section.classList.add('hidden');
  });

  document.getElementById(sectionId).classList.remove('hidden');
}

/* VIEW OPTIONS */

function toggleFullscreen() {

  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

function toggleCinemaMode() {
  document.body.classList.toggle('cinema-mode');
}

function toggleCRT() {
  document.body.classList.toggle('crt');
}

/* EXISTENTIAL EVENT */

setTimeout(() => {
  document.getElementById('existential-overlay')
    .classList.remove('hidden');
}, 45000);

function answerExistence(answer) {

  document.getElementById('existential-overlay')
    .classList.add('hidden');

  if (answer) return;

  document.querySelectorAll('a').forEach(link => {

    link.outerHTML = `
      <p class="fake-text">
        If you don't exist, why are you here
      </p>
    `;
  });

  setTimeout(() => {
    document.getElementById('pill-overlay')
      .classList.remove('hidden');
  }, 60000);
}

/* PILLS */

function bluePill() {
  location.reload();
}

function redPill() {

  document.body.innerHTML = `
    <div style="
      background:black;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:3rem;
      font-family:sans-serif;
    ">
      You've made your choice
    </div>
  `;

  setTimeout(() => {

    window.close();

    document.body.innerHTML += `
      <p style="
        position:fixed;
        bottom:20px;
        width:100%;
        text-align:center;
        color:red;
      ">
        Close the window.
      </p>
    `;

  }, 4000);
}

</script>

</body>
</html>
